name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Android app from the Arabic web interface
        run: |
          mkdir -p www/assets
          cp assets/public/index.html www/index.html
          cp -R assets/. www/assets/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "مندوركوف" com.mandour.coffee.v5 --web-dir www
          node -e "const fs=require('fs');const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p));c.plugins={...(c.plugins||{}),LocalNotifications:{smallIcon:'ic_stat_mandour',iconColor:'#503827'}};fs.writeFileSync(p,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/com/mandour/coffee/v5
          cp android-src/MainActivity.java android/app/src/main/java/com/mandour/coffee/v5/MainActivity.java
          mkdir -p android/app/src/main/res/raw
          cp assets/audio/notification-glass.mp3 android/app/src/main/res/raw/mandour_notification.mp3
          mkdir -p android/app/src/main/res/xml
          cp android-res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp -R android-res/mipmap-* android/app/src/main/res/
          mkdir -p android/app/src/main/res/drawable
          cp android-res/drawable/ic_stat_mandour.xml android/app/src/main/res/drawable/
          cp android-res/values/ic_launcher_background.xml android/app/src/main/res/values/
          sed -i "s/versionCode [0-9]*/versionCode $((29 + GITHUB_RUN_NUMBER))/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.$((29 + GITHUB_RUN_NUMBER))\"/" android/app/build.gradle
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../mandour-coffee-v${GITHUB_RUN_NUMBER}.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mandour Coffee v${{ github.run_number }}
          files: mandour-coffee-v${{ github.run_number }}.apk
