name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Android app from the Arabic web interface
        run: |
          mkdir -p www/assets/beans
          mkdir -p www/assets/payments
          cp index.html www/index.html
          cp assets/beans/*-card.jpg www/assets/beans/
          cp assets/mandour-home-banner.jpg assets/mandour-app-icon.png assets/mandour-welcome-poster.png assets/receipt-stamp.png www/assets/
          cp assets/payments/* www/assets/payments/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Mandour Coffee" com.mandour.coffee.v5 --web-dir www
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/com/mandour/coffee/v5
          cp android-src/MainActivity.java android/app/src/main/java/com/mandour/coffee/v5/MainActivity.java
          mkdir -p android/app/src/main/res/xml
          cp android-res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp -R android-res/mipmap-* android/app/src/main/res/
          cp android-res/values/ic_launcher_background.xml android/app/src/main/res/values/
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../mandour-coffee-v${GITHUB_RUN_NUMBER}.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mandour Coffee v${{ github.run_number }}
          files: mandour-coffee-v${{ github.run_number }}.apk
